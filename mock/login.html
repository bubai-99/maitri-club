<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Sign in · Gede Maitree Club</title>
  <link rel="manifest" href="/member.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/member-180.png" />
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
</head>
<body class="min-h-dvh" data-portal="member">
  <div class="min-h-[calc(100dvh-40px)] lg:grid lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]">
    <!-- Poster side -->
    <aside class="hidden lg:flex relative bg-ink text-white flex-col justify-between p-12 overflow-hidden isolate" aria-hidden="true">
      <div class="absolute inset-0 -z-10" data-auth-photo="pujaIdol"></div>
      <div class="absolute inset-0 -z-10 bg-ink/75"></div>
      <div id="auth-seal"></div>
      <div>
        <p class="font-display leading-[0.95] text-[clamp(3.25rem,4.4vw,4.25rem)] tracking-[-0.02em]" data-bn="গেদে<br />মৈত্রী<br />ক্লাব">Gede<br />Maitree<br />Club</p>
        <p class="poster text-[1.6rem] leading-tight mt-5 text-marigold" data-bn="সদস্যদের প্রবেশপথ">Members’ entrance</p>
        <p class="mt-4 text-[16px] text-white/80 max-w-[38ch]" data-bn="আপনার কার্ড, চাঁদা, পাস আর নোটিস, সব এক অ্যাপে। পাসওয়ার্ড বা ওটিপি দিয়ে লগইন করুন।">Your card, dues, passes and notices, all in one app. Sign in with a password or a one-time code.</p>
      </div>
      <p class="text-[14px] uppercase tracking-wide text-white/75" data-bn="নেতাজি পাড়া · ২০১৪ থেকে">Netaji Para · since 2014</p>
    </aside>

    <!-- Form side -->
    <main class="flex flex-col">
      <header class="flex items-center justify-between px-5 sm:px-10 h-16">
        <a href="index.html" class="flex items-center gap-2.5" aria-label="Gede Maitree Club website">
          <span id="auth-seal-sm"></span>
          <span class="font-display text-xl text-sindoor lg:hidden"><span data-bn="গেদে মৈত্রী ক্লাব">Gede Maitree Club</span></span>
        </a>
        <a href="index.html" class="text-sm font-semibold text-ink-2 hover:text-ink" data-bn="ওয়েবসাইটে ফিরুন">Back to website</a>
      </header>
      <div class="flex-1 flex items-start sm:items-center justify-center px-5 sm:px-10 py-8">
        <div class="w-full max-w-[400px]" id="auth" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/auth.js"></script>
</body>
</html>
