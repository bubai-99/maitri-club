<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Gede Maitree Club member app: dues, receipts, ID cards, events, notices and votes." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Maitree Club" />
  <title>Gede Maitree Club · Member App</title>
  <link rel="manifest" href="/member.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/member-180.png" />
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
</head>
<body class="min-h-dvh bg-paper-2">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[200] focus:bg-ink focus:text-paper focus:px-4 focus:py-2 focus:rounded-md" data-bn="মূল অংশে যান">Skip to content</a>

  <div class="lg:grid lg:grid-cols-[272px_minmax(0,1fr)] min-h-[calc(100dvh-40px)]">

    <!-- Sidebar (laptop) -->
    <aside class="hidden lg:flex flex-col sticky top-0 h-dvh border-r border-rule bg-paper" aria-label="Member app">
      <a href="#home" class="flex items-center gap-3 px-5 h-[72px] shrink-0 border-b border-rule">
        <span id="side-seal"></span>
        <span class="min-w-0 leading-tight">
          <span class="block font-display text-[1.15rem] text-sindoor truncate" data-bn="গেদে মৈত্রী ক্লাব">Gede Maitree Club</span>
          <span class="block text-[12.5px] text-ink-3" data-bn="সদস্য অ্যাপ">Member app</span>
        </span>
      </a>
      <nav class="flex-1 overflow-y-auto px-3 py-4 text-[15px]" id="side-nav" aria-label="Main"></nav>
      <div class="border-t border-rule p-3 shrink-0">
        <a href="#profile" class="flex items-center gap-3 rounded-lg p-2 hover:bg-paper-2" id="side-me"></a>
      </div>
    </aside>

    <!-- Main column -->
    <div class="min-w-0 flex flex-col">
      <header class="sticky top-0 z-40 bg-paper/95 backdrop-blur-sm border-b border-rule" id="topbar">
        <div class="mx-auto max-w-[1120px] h-14 lg:h-[72px] px-4 sm:px-6 lg:px-10 flex items-center gap-2">
          <a href="#home" class="flex items-center gap-2.5 min-w-0 lg:hidden" aria-label="Home">
            <span id="top-seal"></span>
            <span class="font-display text-[1.1rem] text-sindoor truncate" data-bn="গেদে মৈত্রী ক্লাব">Gede Maitree Club</span>
          </a>
          <p class="hidden lg:block text-[15px] text-ink-2 min-w-0 truncate" id="top-greet"></p>
          <div class="ml-auto flex items-center gap-1">
            <div class="hidden lg:flex items-center rounded-md bg-paper-2 p-0.5 mr-2" role="group" aria-label="Language">
              <button data-lang-btn="en" data-app-lang class="px-2.5 h-8 rounded text-sm font-semibold text-ink-2 aria-pressed:bg-white aria-pressed:text-ink">EN</button>
              <button data-lang-btn="bn" data-app-lang class="px-2.5 h-8 rounded text-sm font-semibold text-ink-2 aria-pressed:bg-white aria-pressed:text-ink" lang="bn">বাংলা</button>
            </div>
            <a href="#help" class="w-11 h-11 rounded-full grid place-items-center hover:bg-paper-2" id="top-help"><i data-lucide="circle-help" class="w-5 h-5"></i></a>
            <a href="#alerts" class="w-11 h-11 rounded-full grid place-items-center hover:bg-paper-2 relative" id="top-bell"><i data-lucide="bell" class="w-5 h-5"></i><span class="absolute top-2 right-2 min-w-4 h-4 px-1 rounded-full bg-sindoor text-white text-[10.5px] font-bold grid place-items-center num" id="bell-count"></span></a>
            <a href="#profile" class="w-11 h-11 rounded-full grid place-items-center hover:bg-paper-2" id="top-me"></a>
          </div>
        </div>
        <div id="offline-bar" class="hidden bg-ink text-paper text-sm" role="status">
          <div class="mx-auto max-w-[1120px] px-4 sm:px-6 lg:px-10 py-2 flex items-center gap-2"><i data-lucide="wifi-off" class="w-4 h-4 shrink-0"></i><span data-bn="আপনি অফলাইন। কার্ড, গেটের QR ও পাস চলবে; চাঁদা ও ফর্মের জন্য ইন্টারনেট লাগবে।">You’re offline. Cards, gate QR and passes still work; paying and forms need a connection.</span></div>
        </div>
      </header>

      <main id="main" tabindex="-1" class="flex-1 w-full mx-auto max-w-[1120px] px-4 sm:px-6 lg:px-10 pt-5 lg:pt-8 pb-28 lg:pb-14 focus:outline-none">
        <section data-screen="home" id="s-home"></section>
        <section data-screen="pay" id="s-pay"></section>
        <section data-screen="statement" id="s-statement"></section>
        <section data-screen="receipts" id="s-receipts"></section>
        <section data-screen="receipt" id="s-receipt"></section>
        <section data-screen="id" id="s-id"></section>
        <section data-screen="events" id="s-events"></section>
        <section data-screen="event" id="s-event"></section>
        <section data-screen="notices" id="s-notices"></section>
        <section data-screen="notice" id="s-notice"></section>
        <section data-screen="polls" id="s-polls"></section>
        <section data-screen="docs" id="s-docs"></section>
        <section data-screen="catering" id="s-catering"></section>
        <section data-screen="nursery" id="s-nursery"></section>
        <section data-screen="help" id="s-help"></section>
        <section data-screen="profile" id="s-profile"></section>
        <section data-screen="settings" id="s-settings"></section>
        <section data-screen="alerts" id="s-alerts"></section>
        <section data-screen="more" id="s-more"></section>
      </main>
    </div>
  </div>

  <!-- Bottom tab bar (phone) -->
  <nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 border-t border-rule bg-paper/95 backdrop-blur-sm pb-[env(safe-area-inset-bottom)]" aria-label="App" id="tabbar"></nav>

  <!-- Sheet: bottom sheet on phones, centred dialog on laptops -->
  <div id="sheet" class="fixed inset-0 z-[90] hidden items-end lg:items-center justify-center lg:p-6" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="absolute inset-0 bg-ink/45" data-close></div>
    <div class="relative w-full lg:max-w-[520px] max-h-[92dvh] overflow-y-auto overscroll-contain bg-card rounded-t-3xl lg:rounded-2xl p-5 sm:p-6 pb-[calc(2rem+env(safe-area-inset-bottom))] lg:pb-6 rise shadow-[0_-10px_40px_-20px_rgba(0,0,0,.35)]" id="sheet-body"></div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
