<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2b2f36" />
  <title>Committee sign-in · Gede Maitree Club</title>
  <link rel="manifest" href="/admin.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/admin-180.png" />
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
</head>
<body class="min-h-dvh" data-portal="committee">
  <div class="min-h-[calc(100dvh-40px)] lg:grid lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]">
    <aside class="hidden lg:flex relative bg-ink text-white flex-col justify-between p-12 overflow-hidden isolate" aria-hidden="true">
      <div class="absolute inset-0 -z-10" data-auth-photo="pujaMorning"></div>
      <div class="absolute inset-0 -z-10 bg-ink/75"></div>
      <div id="auth-seal"></div>
      <div>
        <p class="font-display leading-[0.95] text-[clamp(3.25rem,4.4vw,4.25rem)] tracking-[-0.02em]" data-bn="গেদে<br />মৈত্রী<br />ক্লাব">Gede<br />Maitree<br />Club</p>
        <p class="poster text-[1.6rem] leading-tight mt-5 text-marigold" data-bn="কমিটি ঘর">The committee room</p>
        <p class="mt-4 text-[16px] text-white/80 max-w-[38ch]" data-bn="সদস্য, খাতা, চাঁদা, ক্যাটারিং ও নার্সারি। প্রতিটি এন্ট্রিতে আপনার নাম সই হিসেবে থাকে।">Members, the khata, chanda, catering and the nursery. Every entry is signed with your name.</p>
      </div>
      <p class="text-[14px] uppercase tracking-wide text-white/75" data-bn="দুই-ধাপ লগইন · প্রতিটি সেশন অডিট লগে">Two-step sign-in · every session logged</p>
    </aside>

    <main class="flex flex-col">
      <header class="flex items-center justify-between px-5 sm:px-10 h-16">
        <a href="index.html" class="flex items-center gap-2.5" aria-label="Gede Maitree Club website">
          <span id="auth-seal-sm"></span>
          <span class="leading-none lg:hidden">
            <span class="block font-display text-lg text-sindoor"><span data-bn="গেদে মৈত্রী ক্লাব">Gede Maitree Club</span></span>
            <span class="block text-[11.5px] font-semibold tracking-[0.14em] text-ink-2 mt-0.5" data-bn="কমিটি কনসোল">COMMITTEE CONSOLE</span>
          </span>
        </a>
        <a href="index.html" class="text-sm font-semibold text-ink-2 hover:text-ink" data-bn="ওয়েবসাইটে ফিরুন">Back to website</a>
      </header>
      <div class="flex-1 flex items-start sm:items-center justify-center px-5 sm:px-10 py-8">
        <div class="w-full max-w-[400px]" id="auth" aria-live="polite"></div>
      </div>
      <footer class="px-5 sm:px-10 pb-6 flex flex-wrap justify-center gap-x-6 gap-y-2 text-sm text-ink-2">
        <a href="scan.html" class="font-semibold hover:text-ink hover:underline" data-bn="গেটের স্বেচ্ছাসেবক? স্ক্যানার খুলুন →">Gate volunteer? Open the scanner →</a>
        <a href="login.html" class="font-semibold hover:text-ink hover:underline" data-bn="সদস্য? সদস্য অ্যাপে লগইন →">Member? Sign in to the member app →</a>
      </footer>
    </main>
  </div>
  <script type="module" src="/src/auth.js"></script>
</body>
</html>
